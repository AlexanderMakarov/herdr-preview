# herdr-plugin.toml — manifest for herdr-preview.
#
# Preview overlay (hint action) on pane path picks; opens in herdr-file-viewer when
# installed, otherwise `less` in an overlay.

id = "herdr-preview"
name = "herdr-preview"
version = "0.1.0"
description = "Hint-pick file paths from the focused pane recent tail; preview via file-viewer or less."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "hint-overlay"
title = "Preview · scroll origin pane for more"
placement = "overlay"
command = ["./target/release/herdr-preview", "hint-overlay"]

[[panes]]
id = "less"
title = "Preview"
placement = "overlay"
command = ["bash", "scripts/less-pane.sh"]

[[panes]]
id = "browse"
title = "Browse"
placement = "overlay"
command = ["./target/release/herdr-preview", "browse"]

[[actions]]
id = "hint"
platforms = ["linux", "macos"]
title = "Hint-pick openable file paths on screen"
description = "Overlay letter hints on paths in the recent tail; scroll and press a key to open."
command = ["bash", "scripts/run-hint.sh"]
